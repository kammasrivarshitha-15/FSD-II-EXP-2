<form action="login" method="get">

    <div class="input-box">
        <label for="username">Username</label>
        <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>
    </div>

    <div class="input-box">
        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>
    </div>

    <button type="submit" class="login-btn">
        Login
    </button>

</form>
